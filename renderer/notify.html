<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Luna</title>
<style>
  * { box-sizing: border-box; user-select: none; cursor: default; }
  html, body { height: 100%; margin: 0; background: transparent; font-family: Consolas, monospace; }
  #card {
    height: 100%; display: flex; align-items: center; gap: 12px;
    background: #131315; border: 1px solid #2a2a2e; border-left: 3px solid #5865F2;
    border-radius: 10px; padding: 0 14px; overflow: hidden;
  }
  #icon { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #5865F2; color: #cdd0ff; background: #141428; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; }
  #text { flex: 1; min-width: 0; }
  #title { font-size: 13px; color: #f2f2f2; letter-spacing: 1px; }
  #body { font-size: 12px; color: #8a8a90; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #close { border: none; background: transparent; color: #8a8a90; font-size: 18px; width: 28px; height: 28px; border-radius: 6px; }
  #close:hover { background: #1a1a1d; color: #ff5c5c; }
</style>
</head>
<body>
  <div id="card">
    <div id="icon">✦</div>
    <div id="text"><div id="title">LUNA</div><div id="body">Luna finished your task.</div></div>
    <button id="close" title="Close">×</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('msg') || 'Luna finished your task.';
    document.getElementById('body').textContent = msg;
    const hide = () => window.close();
    document.getElementById('close').addEventListener('click', hide);
    document.getElementById('card').addEventListener('doubleclick', hide);
    setTimeout(hide, 7000);
  </script>
</body>
</html>
